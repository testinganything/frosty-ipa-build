name: Build Unsigned Frosty IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout Frosty source
        uses: actions/checkout@v4
        with:
          repository: tommyxchow/frosty
          path: frosty
          ref: main

      - name: Apply playback reliability patches
        run: |
          set -e
          cd frosty

          # 1) Lower stall detection delay 8s -> 5s
          sed -i '' 's/static const stallDetectionDelay = Duration(seconds: 8);/static const stallDetectionDelay = Duration(seconds: 5);/' \
            lib/screens/channel/video/video_timing_constants.dart

          # 2) Lower high-latency threshold 30s -> 12s
          sed -i '' 's/static const int highLatencyThresholdSeconds = 30;/static const int highLatencyThresholdSeconds = 12;/' \
            lib/screens/channel/video/video_timing_constants.dart

          # 3) More precise latency readout (from upstream PR #578 intent)
          #    '${rounded}s' -> '${seconds.toStringAsFixed(2)}s'
          if grep -q "final newLatency = '\${rounded}s';" lib/screens/channel/video/native_video_store.dart; then
            sed -i '' "s/final newLatency = '\${rounded}s';/final newLatency = '\${seconds.toStringAsFixed(2)}s';/" \
              lib/screens/channel/video/native_video_store.dart
          fi

          echo "=== Patched constants ==="
          grep -n 'stallDetectionDelay\|highLatencyThresholdSeconds' lib/screens/channel/video/video_timing_constants.dart || true
          echo "=== Latency display ==="
          grep -n 'newLatency' lib/screens/channel/video/native_video_store.dart | head -5 || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Flutter doctor
        working-directory: frosty
        run: flutter doctor -v

      - name: Get dependencies
        working-directory: frosty
        run: |
          flutter pub get
          flutter --version

      - name: Build unsigned IPA
        working-directory: frosty
        run: |
          set -e
          echo "Attempting flutter build ipa --no-codesign..."
          flutter build ipa --release --no-codesign || true

          echo "Listing build outputs:"
          find build -type f \( -name "*.ipa" -o -name "Runner.app" -o -name "*.app" \) 2>/dev/null | head -30 || true

          if ! ls build/ios/ipa/*.ipa 1>/dev/null 2>&1; then
            echo "No IPA found, trying flutter build ios --no-codesign..."
            flutter build ios --release --no-codesign || true

            APP_PATH=""
            if [ -d "build/ios/iphoneos/Runner.app" ]; then
              APP_PATH="build/ios/iphoneos/Runner.app"
            elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
              APP_PATH="build/ios/Release-iphoneos/Runner.app"
            fi

            if [ -n "$APP_PATH" ]; then
              echo "Packaging $APP_PATH into IPA..."
              rm -rf Payload
              mkdir -p Payload
              cp -R "$APP_PATH" Payload/
              zip -r Frosty-unsigned.ipa Payload
              mkdir -p build/ios/ipa
              mv Frosty-unsigned.ipa build/ios/ipa/
              echo "Created build/ios/ipa/Frosty-unsigned.ipa"
            else
              echo "ERROR: Could not find Runner.app to package"
              find build -name "Runner.app" 2>/dev/null || true
              exit 1
            fi
          fi

          ls -la build/ios/ipa/ || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: frosty-unsigned-ipa-patched
          path: |
            frosty/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
